<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adeptos AI — Auditoría Estratégica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0a0a0f; }

    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-bubble-ai {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.1));
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 0 1rem 1rem 1rem;
    }

    .chat-bubble-user {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.1));
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 1rem 0 1rem 1rem;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 2px; }

    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #818cf8;
      animation: typing 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    .send-btn { transition: all 0.2s ease; }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }

    .pulse-ring {
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
      70% { box-shadow: 0 0 0 12px rgba(99,102,241,0); }
      100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
    }

    .report-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 50%, #7c3aed 100%);
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Header -->
  <div class="w-full max-w-2xl mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/30 pulse-ring">A</div>
      <div>
        <h1 class="text-white font-semibold text-lg leading-none">Adeptos AI</h1>
        <p class="text-indigo-400 text-xs mt-0.5">Agente Auditor Estratégico</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="text-emerald-400 text-xs font-medium">En línea</span>
      </div>
    </div>
  </div>

  <!-- Chat container -->
  <div class="w-full max-w-2xl glass rounded-2xl flex flex-col" style="height: 75vh;">

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto p-5 space-y-4">
      <!-- Se llena con JS -->
    </div>

    <!-- Report card (oculta hasta que esté lista) -->
    <div id="report-card" class="hidden mx-5 mb-4 report-card rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-white/70 text-xs font-medium uppercase tracking-wider">Diagnóstico listo</p>
          <p class="text-white font-bold text-lg mt-0.5">Score: <span id="report-score" class="text-yellow-300"></span>/100</p>
        </div>
        <a id="report-link" href="#" target="_blank"
          class="flex items-center gap-2 bg-white text-indigo-700 font-semibold text-sm px-4 py-2 rounded-lg hover:bg-indigo-50 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Descargar PDF
        </a>
      </div>
    </div>

    <!-- Input -->
    <div class="p-4 border-t border-white/5">
      <div class="flex gap-3 items-end">
        <textarea
          id="input"
          rows="1"
          placeholder="Escribe tu respuesta..."
          class="flex-1 bg-white/5 border border-white/10 text-white placeholder-white/30 rounded-xl px-4 py-3 text-sm resize-none focus:outline-none focus:border-indigo-500/60 focus:bg-white/8 transition-all"
          style="max-height: 120px;"
          disabled
        ></textarea>
        <button id="send-btn"
          class="send-btn w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 disabled:opacity-40 disabled:cursor-not-allowed flex-shrink-0"
          disabled>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
      <p class="text-white/20 text-xs mt-2 text-center">Presiona Enter para enviar · Shift+Enter para nueva línea</p>
    </div>
  </div>

<script>
  let sessionId = null;
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const reportCard = document.getElementById('report-card');

  function addMessage(role, content, animate = false) {
    const wrapper = document.createElement('div');
    wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} items-end gap-2`;

    if (role === 'ai') {
      wrapper.innerHTML = `
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 mb-1">A</div>
        <div class="chat-bubble-ai max-w-xs sm:max-w-md p-3.5 text-sm text-white/90 leading-relaxed" id="msg-${Date.now()}">${content}</div>
      `;
    } else {
      wrapper.innerHTML = `
        <div class="chat-bubble-user max-w-xs sm:max-w-md p-3.5 text-sm text-white/90 leading-relaxed">${content}</div>
      `;
    }

    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  function addTypingIndicator() {
    const wrapper = document.createElement('div');
    wrapper.className = 'flex justify-start items-end gap-2';
    wrapper.id = 'typing';
    wrapper.innerHTML = `
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 mb-1">A</div>
      <div class="chat-bubble-ai p-3.5 flex gap-1.5 items-center">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  function setInputEnabled(enabled) {
    inputEl.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) inputEl.focus();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !sessionId) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    setInputEnabled(false);
    addMessage('user', text);

    const typing = addTypingIndicator();

    // AI bubble que se llenará con streaming
    let aiWrapper = null;
    let aiContent = '';

    try {
      const response = await fetch('/api/chat/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message: text }),
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const json = JSON.parse(line.slice(6));

          if (json.type === 'token') {
            if (!aiWrapper) {
              removeTyping();
              aiWrapper = addMessage('ai', '');
            }
            aiContent += json.content;
            // Encontrar el div del mensaje y actualizar
            const msgDiv = aiWrapper.querySelector('[id^="msg-"]');
            if (msgDiv) {
              // Filtrar el JSON final del display
              const display = aiContent.replace(/###AUDIT_COMPLETE###:.*$/s, '').trim();
              msgDiv.textContent = display;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } else if (json.type === 'generating_report') {
            addMessage('ai', '⏳ Generando tu diagnóstico premium con IA... esto tomará unos segundos.');
          } else if (json.type === 'report_ready') {
            document.getElementById('report-score').textContent = json.score;
            document.getElementById('report-link').href = json.pdfUrl;
            reportCard.classList.remove('hidden');
            addMessage('ai', '✅ ¡Tu diagnóstico está listo! Descárgalo arriba 👆');
            setInputEnabled(false);
          } else if (json.type === 'done') {
            removeTyping();
            setInputEnabled(true);
          } else if (json.type === 'error') {
            removeTyping();
            addMessage('ai', '❌ Ocurrió un error generando el reporte. Inténtalo de nuevo.');
            setInputEnabled(true);
          }
        }
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', '❌ Error de conexión. Por favor recarga la página.');
    }
  }

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // Iniciar sesión al cargar
  async function init() {
    addTypingIndicator();
    try {
      const res = await fetch('/api/chat/session', { method: 'POST' });
      const data = await res.json();
      sessionId = data.sessionId;
      removeTyping();
      addMessage('ai', data.message);
      setInputEnabled(true);
    } catch (err) {
      removeTyping();
      addMessage('ai', '❌ No se pudo conectar con el servidor. Verifica que la API esté corriendo.');
    }
  }

  init();
</script>

</body>
</html>
